name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Allow this workflow to write the Pages artifact + deploy it.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid stacked deploys: if main is pushed twice, cancel the older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + golden tests (codegen)
        run: pnpm --filter @monome-iii-studio/codegen test

      - name: Build web app
        run: pnpm --filter web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
